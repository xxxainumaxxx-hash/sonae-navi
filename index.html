      {name:"トイレットペーパー",qty:"2ヶ月分",why:"かさばるが腐らない。箱買い一択",kw:"トイレットペーパー 長持ち 箱"},

      {name:"防水・耐火ドキュメントバッグ",qty:"1個",why:"通帳・証券・権利書を火と水から守る",kw:"耐火 防水 書類バッグ"},
      {name:"電気代モニター（ワットチェッカー）",qty:"1個",why:"電気食い家電を特定して削る",kw:"ワットチェッカー 電気代"},

    ],
    videos:[V.koteihiTop20,V.hisaigo,V.furusato10,V.setsuyaku7,V.denki7,V.koteihiTop5,V.saiene,V.aircon,V.furusato],

// ============ 診断データ ============
const YT_VIDEOS = { mansion:V.bichiku50, house:V.bichiku50, apart:V.hinanjo };
const QUESTIONS = [
  { id:"family", q:"家族は何人？", sub:"同居している人数（自分を含む）",
    opts:[{v:1,label:"1人"},{v:2,label:"2人"},{v:4,label:"3〜4人"},{v:5,label:"5人以上"}] },
  { id:"home", q:"住まいは？", sub:"災害時の行動が大きく変わります",
    opts:[{v:"mansion",label:"マンション"},{v:"house",label:"戸建て"},{v:"apart",label:"アパート・その他"}] },
  { id:"kids", q:"小さい子どもは？", sub:"",
    opts:[{v:"baby",label:"乳幼児がいる"},{v:"kid",label:"小学生以上"},{v:"none",label:"いない"}] },
  { id:"pet", q:"ペットは？", sub:"",
    opts:[{v:"yes",label:"犬・猫がいる"},{v:"no",label:"いない"}] },
  { id:"budget", q:"備えにかけられる予算は？", sub:"無理のない範囲でOK",
    opts:[{v:1,label:"〜1万円"},{v:3,label:"1〜3万円"},{v:5,label:"3〜5万円"},{v:99,label:"5万円以上"}] },
  { id:"stock", q:"今の備蓄は？", sub:"正直に答えるほど診断が正確になります",
    opts:[{v:"zero",label:"ほぼゼロ"},{v:"water",label:"水くらいはある"},{v:"some",label:"ある程度そろえている"}] },
];
const TYPE_INFO = {
  mansion:{ name:"垂直孤立型",
    desc:"エレベーター停止で高層階が「陸の孤島」になるタイプ。水とトイレの確保が生死を分けます。",
    risks:["エレベーター停止で水を上に運べない","断水と同時にトイレが使用不能になる","給水所まで階段で往復するのは現実的に不可能"]},
  house:{ name:"自宅籠城型",
    desc:"在宅避難が基本になるタイプ。スペースはあるのに備蓄量が追いついていない家がほとんどです。",
    risks:["停電で冷蔵庫の食材が2日で全滅する","家族人数分の水は想像の2倍以上必要","断水時のトイレ問題は戸建てでも同じ"]},
  apart:{ name:"即時避難型",
    desc:"建物被害で在宅避難できない可能性があるタイプ。「持ち出せる備え」が最優先です。",
    risks:["建物損傷で自宅に戻れなくなる可能性","持ち出し袋がないと避難所生活で詰む","収納が少なく備蓄が薄くなりがち"]},
};
function buildResult(a){
  const people=a.family, days=a.home==="apart"?3:7;
  let score=a.stock==="zero"?12:a.stock==="water"?26:44;
  if(a.kids==="baby")score-=6;
  if(a.pet==="yes")score-=4;
  if(a.home==="mansion")score-=4;
  score=Math.max(8,score);
  const items=[];
  items.push({name:"長期保存水",qty:`${people*3*days}L（${people}人×3L×${days}日）`,why:"命に直結。給水車は当てにできない",kw:"保存水 2L 長期保存 5年"});
  items.push({name:"簡易トイレ",qty:`${people*5*days}回分`,why:"断水後3時間で必要になる。最も後悔する備え",kw:"簡易トイレ 100回分 凝固剤"});
  items.push({name:"長期保存食",qty:`${people*3*days}食分`,why:"火を使わず食べられるものを中心に",kw:"非常食 セット 長期保存"});
  if(a.kids==="baby")items.push({name:"液体ミルク・オムツ",qty:"1週間分",why:"支援物資では後回しにされる。親しか守れない",kw:"液体ミルク 常温 防災"});
  if(a.pet==="yes")items.push({name:"ペットフード・ペットシーツ",qty:"7日分",why:"避難所にペット用の備えは無い",kw:"ペット 防災 セット"});
  items.push({name:a.budget>=3?"ポータブル電源":"大容量モバイルバッテリー",qty:"1台",why:"停電時の情報源＝スマホを死なせない",kw:a.budget>=3?"ポータブル電源 500Wh":"モバイルバッテリー 20000mAh"});
  items.push({name:"カセットコンロ＋ボンベ",qty:`ボンベ${Math.max(6,people*2)}本`,why:"温かい食事が精神を守る",kw:"カセットコンロ ボンベ セット"});
  if(a.home==="mansion")items.push({name:"ウォータータンク＋キャリーカート",qty:"各1",why:"給水を階段で運ぶ唯一の手段",kw:"ウォータータンク キャリーカート 防災"});
  if(a.home==="apart")items.push({name:"防災リュックセット",qty:`${people}人分`,why:"3分で家を出られる状態を作る",kw:"防災リュック セット 2人用"});
  items.push({name:"LEDランタン",qty:"2個以上",why:"スマホライトは3時間で終わる",kw:"LEDランタン 防災 電池"});
  const nowCount=a.budget<=1?3:a.budget<=3?5:a.budget<=5?7:items.length;
  return {score,items,nowCount,type:TYPE_INFO[a.home],video:YT_VIDEOS[a.home],people,days};
}

// ============ 画面 ============
const app=document.getElementById("app");
let ans={};

function itemsHTML(items,nowCount){
  return items.map((it,i)=>{
    const now=i<(nowCount??items.length);
    return `<div class="item ${now?"now":""}">
      <div class="itemhead"><span class="chip">${now?"今すぐ":"次に"}</span><span class="itemname">${esc(it.name)}</span></div>
      <div class="qty">目安：${esc(it.qty)}</div>
      <div class="why">${esc(it.why)}</div>
      <a class="amzbtn" href="${amz(it.kw)}" target="_blank" rel="noopener noreferrer">Amazonで見る →</a>
    </div>`;
  }).join("");
}
function ytHTML(eb,videos){
  if(!videos||videos.length===0){
    return `<div class="ytcard"><div class="eb">▌${esc(eb)}</div>
      <p class="t">このテーマの動画は近日公開！最新動画はチャンネルでチェック</p>
      <a class="ytbtn" href="${YT_CHANNEL}" target="_blank" rel="noopener noreferrer">▶ 備えニキのチャンネルを見る</a></div>`;
  }
  const main=videos[0];
  const rest=videos.slice(1).map(v=>
    `<a class="ytrow" href="${v.url}" target="_blank" rel="noopener noreferrer"><span class="pl">▶</span><span>${esc(v.title)}</span></a>`
  ).join("");
  return `<div class="ytcard"><div class="eb">▌${esc(eb)}</div>
    <p class="t">「${esc(main.title)}」</p>
    <a class="ytbtn" href="${main.url}" target="_blank" rel="noopener noreferrer">▶ 動画で詳しく見る（無料）</a>
    ${rest?`<div class="ytmore">${rest}</div>`:""}</div>`;
}

function renderHome(){
  app.innerHTML=`
    <div class="eyebrow">▌災害はあなたの準備を待たない</div>
    <h1>地震から値上げまで<br><span class="yl">生活防衛</span>の総合ナビ</h1>
    <p class="lead">あなたの家に本当に必要な備えだけを診断。まずは30秒の生存準備度チェックから。</p>
    <a class="cta" href="#shindan">30秒で生存準備度を診断する →</a>
    <p class="note">登録不要・個人情報の入力なし</p>
    <div class="sech">備えたいものから選ぶ</div>
    <div class="secn">それぞれ危険度チェックと必要リストがあります</div>
    <div class="grid">
      ${Object.entries(CATS).map(([id,c])=>`
        <a class="tile" href="#c/${id}">
          <div class="ic">${c.ic}</div>
          <div class="tn">${esc(c.name)}</div>
          <div class="td">${esc(c.catch)}</div>
        </a>`).join("")}
    </div>
    <div class="sech">迷ったらこれを揃える</div>
    <div class="secn">備えニキ厳選の備蓄品まとめ</div>
    <div class="moneybtns">
      <a class="moneybtn" href="${AMZN_LIST}" target="_blank" rel="noopener noreferrer">🛒 Amazonおすすめ<br>備蓄品まとめ</a>
      <a class="moneybtn" href="${RAKUTEN_ROOM}" target="_blank" rel="noopener noreferrer">🛍 楽天ROOMで<br>まとめて見る</a>
    </div>
    ${ytHTML("今見るべき1本",[V.bichiku50])}
    <p class="disclaimer">※商品リンクはAmazonアソシエイト・楽天ROOMを利用しています</p>`;
  scrollTo(0,0);
}

function renderCat(id){
  const c=CATS[id]; if(!c)return renderHome();
  app.innerHTML=`
    <div class="eyebrow">▌${esc(c.catch)}</div>
    <h1>${c.ic} ${esc(c.name)}</h1>
    <p class="lead">${esc(c.desc)}</p>
    <h3>危険度チェック</h3>
    <p class="listnote">当てはまるものにチェック（多いほど安全）</p>
    ${c.checks.map((t,i)=>`<label class="chk"><input type="checkbox" onchange="chkScore('${id}')" id="chk-${id}-${i}"><span>${esc(t)}</span></label>`).join("")}
    <div class="chkresult" id="chkres-${id}">チェックすると準備度が出ます</div>
    <div class="hazard hz-div"></div>
    <h3>必要なものリスト</h3>
    <p class="listnote">優先順。チェックが少なかった人は上から順に</p>
    ${itemsHTML(c.items)}
    ${ytHTML(c.name+"の動画",c.videos)}
    <a class="retry" href="#">← トップに戻る</a>
    <p class="disclaimer">※本ページは目安です。商品リンクはAmazonアソシエイトを利用しています</p>`;
  scrollTo(0,0);
}

function chkScore(id){
  const c=CATS[id];
  const n=c.checks.filter((_,i)=>document.getElementById(`chk-${id}-${i}`).checked).length;
  const pct=Math.round(n/c.checks.length*100);
  const msg=pct<=20?"危険水準。今日から始めましょう":pct<=60?"要警戒。穴を埋めましょう":pct<100?"あと一歩！":"完璧です。維持と点検を";
  document.getElementById(`chkres-${id}`).innerHTML=`準備度 <span class="big">${pct}%</span><br><span style="font-size:12px;color:var(--mut)">${msg}</span>`;
}

function renderQ(i){
  const q=QUESTIONS[i];
  app.innerHTML=`
    <div class="pbar"><div class="pfill" id="pf"></div></div>
    <div class="qnum">Q${i+1} / 6</div>
    <h2>${esc(q.q)}</h2>
    <p class="qsub">${esc(q.sub)}</p>
    ${q.opts.map((o,j)=>`<button class="opt" onclick="pick(${i},${j})">${esc(o.label)}</button>`).join("")}
    ${i>0?`<button class="back" onclick="renderQ(${i-1})">← 前の質問に戻る</button>`:`<a class="back" href="#" style="display:inline-block;text-decoration:none">← トップに戻る</a>`}`;
  requestAnimationFrame(()=>{document.getElementById("pf").style.width=((i+1)/6*100)+"%"});
  scrollTo(0,0);
}
function pick(i,j){
  ans[QUESTIONS[i].id]=QUESTIONS[i].opts[j].v;
  i<5?renderQ(i+1):renderScan();
}
function renderScan(){
  app.innerHTML=`<div class="scanbox"><div class="scantxt">診断中…</div>
    <div class="scanbar"><div style="height:4px;background:var(--yellow);animation:scan 1.6s linear forwards"></div></div>
    <p class="scannote">住まい・家族構成・現在の備蓄からリスクを計算しています</p></div>`;
  setTimeout(renderResult,1700);
}
function renderResult(){
  const r=buildResult(ans);
  const judge=r.score<20?"危険水準":r.score<35?"要警戒":"あと一歩";
  const mods=(ans.kids==="baby"?'<span class="mod"> × 乳幼児リスク</span>':"")+(ans.pet==="yes"?'<span class="mod"> × ペット同伴</span>':"");
  app.innerHTML=`
    <div class="card"><div class="lbl">あなたの生存準備度</div>
      <div class="scorerow"><span class="score" id="scoreNum">0</span><span class="scoreunit">%</span><span class="badge">${judge}</span></div>
      <div class="gauge"><div class="gaugefill" id="gf"></div></div>
      <p class="cardnote">大規模災害の在宅・避難生活${r.days}日間を想定した充足率です</p></div>
    <div class="card"><div class="section-eyebrow">▌あなたのタイプ</div>
      <div class="typename">${esc(r.type.name)}${mods}</div>
      <p class="typedesc">${esc(r.type.desc)}</p>
      ${r.type.risks.map(x=>`<div class="risk"><span class="ic">⚠</span><span>${esc(x)}</span></div>`).join("")}</div>
    <div class="hazard hz-div"></div>
    <h3>あなたの家に必要な備蓄リスト</h3>
    <p class="listnote">${r.people}人・${r.days}日分で計算。上から優先順に並んでいます</p>
    ${itemsHTML(r.items,r.nowCount)}
    ${ytHTML(r.type.name+"のあなたへ",[r.video])}
    <div class="sech">他のリスクにも備える</div>
    <div class="grid">
      ${["bouhan","kaji","suigai","teiden","neage","okane"].map(id=>`
        <a class="tile" href="#c/${id}"><div class="ic">${CATS[id].ic}</div>
        <div class="tn">${esc(CATS[id].name)}</div><div class="td">${esc(CATS[id].catch)}</div></a>`).join("")}
    </div>
    <a class="retry" href="#shindan" onclick="ans={}" style="margin-top:14px">もう一度診断する</a>
    <p class="disclaimer">※本診断は目安です。商品リンクはAmazonアソシエイトを利用しています</p>`;
  scrollTo(0,0);
  setTimeout(()=>{
    document.getElementById("gf").style.width=r.score+"%";
    const el=document.getElementById("scoreNum");
    let n=0;const step=()=>{n=Math.min(r.score,n+1);el.textContent=n;if(n<r.score)requestAnimationFrame(step)};
    requestAnimationFrame(step);
  },300);
}

function route(){
  const h=location.hash;
  if(h==="#shindan"){ans={};renderQ(0);}
  else if(h.startsWith("#c/")){renderCat(h.slice(3));}
  else renderHome();
}
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
